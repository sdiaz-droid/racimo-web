<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Vista previa de MyLinks del Hotel Los Álamos con la cara REAL del producto (referencia de Fer, 13/11).
     Sin logo de Racimo: lo que ve el huésped es siempre del hotel (regla de Aldana, 13/11).
     foto a sangre, logo en círculo, nombre y botones de vidrio centrados. Mismos links que el editor del video.
     Pantalla del celular del editor: 289 × 623,5 de mundo. Render: mylinks-video.py → web-mylinks-cel.webp -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#pantalla{position:relative;width:289px;height:623.5px;overflow:hidden;color:#fff;text-align:center}
.fondo{position:absolute;inset:0;background:url(F_colonial) center 35%/cover}
.fondo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,12,.25) 0%,rgba(10,14,12,.48) 38%,rgba(10,14,12,.62) 100%)}
.cont{position:relative;padding:0 17px}
.top{display:flex;justify-content:space-between;padding:12px 12px 0}
.bt-sq{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center}
.bt-sq.iso{background:rgba(255,255,255,.3)}.bt-sq img{width:16px;height:16px;border-radius:3px}
.bt-sq svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{width:62px;height:62px;margin:4px auto 0;border-radius:50%;background:rgba(255,255,255,.28);backdrop-filter:blur(8px);display:grid;place-items:center}
.logo{background:rgba(255,255,255,.35)}.logo span{width:44px;height:44px;border-radius:50%;background:#f5efe6;color:#1f4a3a;display:grid;place-items:center;font:500 17px/1 Georgia,serif;letter-spacing:.02em}
h1{font-size:15.5px;font-weight:700;margin:10px 0 18px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.bajada{font-size:8.6px;line-height:1.45;opacity:.92;margin:5px 8px 0;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.redes{display:flex;justify-content:center;gap:16px;margin:10px 0 14px}
.redes svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.link{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:36px;margin-bottom:8px;padding:6px 30px;border-radius:7px;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);font-size:9.6px;font-weight:600}
.link small{display:block;font-size:7.4px;font-weight:500;opacity:.85;margin-top:2px}
.link svg{position:absolute;left:11px;top:50%;width:12px;height:12px;margin-top:-6px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.col{font-size:8.4px;font-weight:600;opacity:.95;margin:11px 0 7px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.pie{position:absolute;left:0;right:0;bottom:14px;font-size:7px;opacity:.75}
.pie .redes{margin:0 0 6px;gap:18px}
</style></head><body>
<div id="pantalla">
  <div class="fondo"></div>
  <div class="top">
    <span></span>
    <span class="bt-sq"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>
  </div>
  <div class="cont">
    <div class="logo"><span>LÁ</span></div>
    <h1>Hotel Los Álamos</h1>
    <div class="link"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Web oficial</div>
    <div class="link"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Reservar ahora<small>Mejor precio garantizado</small></div>
    <div class="link"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Escribinos por email</div>
    <div class="link"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg>Llamanos</div>
    <div class="link"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/></svg>Promociones</div>
    <div class="col">Nueva colección</div>
    <div class="link"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Reservar</div>
  </div>
  <div class="pie">
    <div class="redes">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg>
    </div>
    hotellosalamos.com/mylinks
  </div>
</div>
</body></html>
